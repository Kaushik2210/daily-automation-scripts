name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tooling
        run: pip install ruff pytest
      - name: Install script requirements
        run: |
          find scripts -name requirements.txt -print0 | xargs -0 -r -n1 pip install -r
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest scripts -q || test $? -eq 5
