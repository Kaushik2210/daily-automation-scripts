name: CI

# Linux runs on every push. Windows and macOS minutes cost far more, so they run
# on pull requests, once a week, or when started by hand.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .

  test:
    name: test (ubuntu-latest, py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - name: Install script requirements
        shell: python
        run: |
          import pathlib, subprocess, sys
          for req in pathlib.Path("scripts").rglob("requirements.txt"):
              subprocess.check_call([sys.executable, "-m", "pip", "install", "-r", str(req)])
      - name: Run tests
        shell: python
        run: |
          import subprocess, sys
          code = subprocess.call([sys.executable, "-m", "pytest", "scripts", "web"])
          sys.exit(0 if code == 5 else code)

  test-other-os:
    name: test (${{ matrix.os }}, py3.12)
    if: github.event_name != 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Install script requirements
        shell: python
        run: |
          import pathlib, subprocess, sys
          for req in pathlib.Path("scripts").rglob("requirements.txt"):
              subprocess.check_call([sys.executable, "-m", "pip", "install", "-r", str(req)])
      - name: Run tests
        shell: python
        run: |
          import subprocess, sys
          code = subprocess.call([sys.executable, "-m", "pytest", "scripts", "web"])
          sys.exit(0 if code == 5 else code)
