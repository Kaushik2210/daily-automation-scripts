name: Pages

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "web/**"
      - "PLAN.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install script requirements
        run: find scripts -name requirements.txt -print0 | xargs -0 -r -n1 pip install -r
      - name: Build site
        run: python web/build_site.py --out _site --repo "https://github.com/${{ github.repository }}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Check live links
        run: |
          for attempt in 1 2 3 4 5; do
            python web/check_links.py --site "${{ steps.deployment.outputs.page_url }}" && exit 0
            sleep 20
          done
          exit 1
